services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion_admin
      POSTGRES_PASSWORD: orion_admin_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion_admin -d orion"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-server:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m database.seed && python -m mcp_server.server"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://orion_admin:orion_admin_dev@postgres:5432/orion
      DATABASE_URL: postgresql+psycopg://orion_reader:orion_reader_dev@postgres:5432/orion
      MCP_DISCOVERY_ATTEMPTS: 30
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: local-only
      LLM_MODEL: qwen2.5:3b
      MCP_DISCOVERY_ATTEMPTS: 30
      MCP_DISCOVERY_RETRY_SECONDS: 1.0
      MAX_HISTORY_MESSAGES: 20
      MAX_TOOL_ROUNDS: 4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcp-server:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
